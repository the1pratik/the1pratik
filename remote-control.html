<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Control</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .remote {
      background: linear-gradient(145deg, #16213e, #0f3460);
      border-radius: 40px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .brand {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e94560;
      margin-bottom: 28px;
    }

    /* Power & Input row */
    .top-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    /* Button base */
    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
      position: relative;
      outline: none;
    }

    button:active {
      transform: scale(0.93);
    }

    /* Round small button */
    .btn-round {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1a1a3e, #12122e);
      color: #e0e0e0;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        3px 3px 8px rgba(0, 0, 0, 0.4),
        -2px -2px 6px rgba(255, 255, 255, 0.03);
    }

    .btn-round:active {
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
    }

    .btn-power {
      background: linear-gradient(145deg, #c0392b, #96281b);
      color: #fff;
    }

    .btn-power:active {
      background: #e94560;
    }

    /* Volume & Channel columns */
    .vol-ch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .vol-ch-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .vol-ch-group .label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 4px;
    }

    .btn-pill {
      width: 56px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1a1a3e, #12122e);
      color: #e0e0e0;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        3px 3px 8px rgba(0, 0, 0, 0.4),
        -2px -2px 6px rgba(255, 255, 255, 0.03);
    }

    .btn-pill:active {
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
    }

    /* D-Pad */
    .dpad-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .dpad {
      position: relative;
      width: 180px;
      height: 180px;
    }

    .dpad .btn-ok {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e94560, #c0392b);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
      z-index: 2;
    }

    .dpad .btn-ok:active {
      background: linear-gradient(145deg, #c0392b, #e94560);
      box-shadow: 0 2px 8px rgba(233, 69, 96, 0.4);
    }

    .dpad .btn-dir {
      position: absolute;
      background: linear-gradient(145deg, #1a1a3e, #12122e);
      color: #aaa;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        3px 3px 8px rgba(0, 0, 0, 0.4),
        -2px -2px 6px rgba(255, 255, 255, 0.03);
    }

    .dpad .btn-dir:active {
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
      color: #e94560;
    }

    .btn-up {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 52px;
      border-radius: 16px 16px 8px 8px;
    }

    .btn-down {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 52px;
      border-radius: 8px 8px 16px 16px;
    }

    .btn-left {
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 56px;
      border-radius: 16px 8px 8px 16px;
    }

    .btn-right {
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 56px;
      border-radius: 8px 16px 16px 8px;
    }

    /* Media controls */
    .media-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .btn-media {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1a1a3e, #12122e);
      color: #e0e0e0;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        3px 3px 8px rgba(0, 0, 0, 0.4),
        -2px -2px 6px rgba(255, 255, 255, 0.03);
    }

    .btn-media:active {
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
      color: #e94560;
    }

    /* Navigation row */
    .nav-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 24px;
    }

    .btn-nav {
      padding: 10px 18px;
      border-radius: 10px;
      background: linear-gradient(145deg, #1a1a3e, #12122e);
      color: #e0e0e0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow:
        3px 3px 8px rgba(0, 0, 0, 0.4),
        -2px -2px 6px rgba(255, 255, 255, 0.03);
    }

    .btn-nav:active {
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
      color: #e94560;
    }

    /* Number pad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn-num {
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1a1a3e, #12122e);
      color: #e0e0e0;
      font-size: 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        3px 3px 8px rgba(0, 0, 0, 0.4),
        -2px -2px 6px rgba(255, 255, 255, 0.03);
    }

    .btn-num:active {
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
      color: #e94560;
    }

    /* Color buttons */
    .color-row {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn-color {
      width: 32px;
      height: 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-color:active {
      transform: scale(0.9);
    }

    .btn-red    { background: #e74c3c; }
    .btn-green  { background: #2ecc71; }
    .btn-yellow { background: #f1c40f; }
    .btn-blue   { background: #3498db; }

    /* Feedback overlay */
    .feedback {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(233, 69, 96, 0.9);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
    }

    .feedback.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="feedback" id="feedback"></div>

  <div class="remote">
    <div class="brand">Remote</div>

    <!-- Power & Input -->
    <div class="top-row">
      <button class="btn-round btn-power" data-action="Power" aria-label="Power">&#x23FB;</button>
      <button class="btn-round" data-action="Mute" aria-label="Mute">&#x1F507;</button>
      <button class="btn-round" data-action="Input" aria-label="Input">&#x23CF;</button>
    </div>

    <!-- Volume & Channel with D-Pad -->
    <div class="vol-ch-row">
      <div class="vol-ch-group">
        <span class="label">Vol</span>
        <button class="btn-pill" data-action="Volume Up" aria-label="Volume Up">+</button>
        <button class="btn-pill" data-action="Volume Down" aria-label="Volume Down">&minus;</button>
      </div>

      <div class="dpad">
        <button class="btn-dir btn-up" data-action="Up" aria-label="Up">&#x25B2;</button>
        <button class="btn-dir btn-right" data-action="Right" aria-label="Right">&#x25B6;</button>
        <button class="btn-dir btn-down" data-action="Down" aria-label="Down">&#x25BC;</button>
        <button class="btn-dir btn-left" data-action="Left" aria-label="Left">&#x25C0;</button>
        <button class="btn-ok" data-action="OK" aria-label="OK">OK</button>
      </div>

      <div class="vol-ch-group">
        <span class="label">Ch</span>
        <button class="btn-pill" data-action="Channel Up" aria-label="Channel Up">+</button>
        <button class="btn-pill" data-action="Channel Down" aria-label="Channel Down">&minus;</button>
      </div>
    </div>

    <!-- Navigation -->
    <div class="nav-row">
      <button class="btn-nav" data-action="Menu">Menu</button>
      <button class="btn-nav" data-action="Home">Home</button>
      <button class="btn-nav" data-action="Back">Back</button>
      <button class="btn-nav" data-action="Guide">Guide</button>
    </div>

    <!-- Media Controls -->
    <div class="media-row">
      <button class="btn-media" data-action="Rewind" aria-label="Rewind">&#x23EA;</button>
      <button class="btn-media" data-action="Play/Pause" aria-label="Play Pause">&#x23EF;</button>
      <button class="btn-media" data-action="Stop" aria-label="Stop">&#x23F9;</button>
      <button class="btn-media" data-action="Fast Forward" aria-label="Fast Forward">&#x23E9;</button>
    </div>

    <!-- Number Pad -->
    <div class="numpad">
      <button class="btn-num" data-action="1">1</button>
      <button class="btn-num" data-action="2">2</button>
      <button class="btn-num" data-action="3">3</button>
      <button class="btn-num" data-action="4">4</button>
      <button class="btn-num" data-action="5">5</button>
      <button class="btn-num" data-action="6">6</button>
      <button class="btn-num" data-action="7">7</button>
      <button class="btn-num" data-action="8">8</button>
      <button class="btn-num" data-action="9">9</button>
      <button class="btn-num" data-action="Info">INFO</button>
      <button class="btn-num" data-action="0">0</button>
      <button class="btn-num" data-action="Exit">EXIT</button>
    </div>

    <!-- Color Buttons -->
    <div class="color-row">
      <button class="btn-color btn-red" data-action="Red" aria-label="Red"></button>
      <button class="btn-color btn-green" data-action="Green" aria-label="Green"></button>
      <button class="btn-color btn-yellow" data-action="Yellow" aria-label="Yellow"></button>
      <button class="btn-color btn-blue" data-action="Blue" aria-label="Blue"></button>
    </div>
  </div>

  <script>
    const feedback = document.getElementById('feedback');
    let feedbackTimer;

    function showFeedback(text) {
      feedback.textContent = text;
      feedback.classList.add('show');
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => feedback.classList.remove('show'), 800);
    }

    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.getAttribute('data-action');
        showFeedback(action);

        // Haptic feedback if available
        if (navigator.vibrate) {
          navigator.vibrate(30);
        }
      });
    });
  </script>
</body>
</html>
